<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login | UNISAL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="login-card">
		<div class="brand"><span aria-hidden="true">U</span> UNISAL</div>
		<h1>Bem-vindo(a) de volta</h1>
		<p class="intro">Acesse sua conta para continuar.</p>

		<form action="#" method="post">
			<div class="field">
				<label for="email">E-mail</label>
				<input id="email" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
			</div>
			<div class="field">
				<label for="senha">Senha</label>
				<input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
			</div>
			<div class="options">
				<label class="remember" for="lembrar"><input id="lembrar" name="lembrar" type="checkbox"> Lembrar de mim</label>
				<a href="#recuperar-senha">Esqueceu a senha?</a>
			</div>
			<button type="submit">Entrar</button>
		</form>

		<p class="signup">Ainda não tem uma conta? <a href="#cadastro">Criar conta</a></p>
	</main>
</body>
</html>
